name: Cinema City watchdog

# Zkontroluje rozpis Cinema City a když přibudou termíny hlídaných filmů
# v IMAXu, založí issue (GitHub z něj pošle e-mail i push do appky).
#
# Hlídané filmy jsou v matici FILMS níž — jeden řádek "slug:podřetězec názvu".
# Každý film má vlastní stav (state/<slug>.json) i vlastní issue, ale běží
# ve stejném jobu za sebou: dva paralelní joby by si přepsaly commit stavu.
#
# Naplánováno 4× za hodinu, i když cílem je detekce do ~30 minut: GitHub
# u scheduled workflows běhy pod zátěží houfně zahazuje (naměřeno 1 z 8).
# Přebývající běhy nic nestojí (veřejné repo) a nic nerozbijí — hlášení se
# odvíjí od stavu v state/<slug>.json, ne od času, takže běh navíc jen zjistí,
# že se nic nezměnilo, a mlčí. Minuty schválně mimo :00 a :30 a rozprostřené,
# ať netrefí stejnou špičku.
on:
  schedule:
    - cron: "8,38 * * * *"
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Nahlásit všechny aktuální termíny, i už známé"
        type: boolean
        default: false

# Stav se commituje zpátky do repa — souběžné běhy by si přepsaly commit.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zkontrolovat rozpis
        # Chceš hlídat další film? Přidej řádek do FILMS ve tvaru
        # "slug:podřetězec názvu". Pozor, API vrací české názvy — Duna, ne Dune.
        # Jiný typ sálu? Přepiš AUDITORIUM_PATTERN. Když měníš existující řádek,
        # smaž i jeho state/<slug>.json, jinak se nový výběr porovná se starým.
        env:
          FILMS: |
            odyssea:odyss
            duna:duna
          AUDITORIUM_PATTERN: imax
        run: |
          set -euo pipefail
          while IFS=: read -r slug pattern; do
            [ -n "$slug" ] || continue
            echo "::group::$slug (film ~ $pattern)"
            FILM_PATTERN="$pattern" python3 watch.py \
              --state "state/$slug.json" \
              --report "report-$slug.md" \
              --title "title-$slug.txt" \
              ${{ inputs.force_report && '--force-report' || '' }}
            echo "::endgroup::"
          done <<< "$FILMS"

      - name: Založit issue s novými termíny
        # Bez podmínky na výstup kroku: watch.py zakládá report jen když má co
        # hlásit, takže o počtu issue rozhoduje existence souborů. Krok se
        # nesmí přeskočit celý — jeden film může mít novinky a druhý ne.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Přiřazení vlastníkovi je klíčové: GitHub posílá e-mail defaultně jen
          # u "Participating" notifikací (přiřazení, zmínky). Pouhé "Watching"
          # repa dává jen web/mobile notifikaci, e-mail je tam vypnutý.
          shopt -s nullglob
          for report in report-*.md; do
            slug=${report#report-}; slug=${slug%.md}
            url=$(gh issue create \
              --title "$(cat "title-$slug.txt")" \
              --body-file "$report" \
              --assignee "${{ github.repository_owner }}")
            echo "Založeno ($slug): $url"
            # Issue je jen doručovací kanál pro notifikaci — e-mail odejde už
            # při založení, takže ho rovnou zavíráme a seznam otevřených
            # zůstává prázdný. Obsah zůstane čitelný mezi zavřenými issues.
            gh issue close "$url" --reason completed
          done

      - name: Uložit stav zpátky do repa
        run: |
          rm -f report-*.md title-*.txt
          if git diff --quiet -- state/; then
            echo "Stav beze změny, není co commitovat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Aktualizace stavu rozpisu ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Mezitím mohl doběhnout jiný commit — zkusíme rebase a push znovu.
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Push stavu se nepovedl."
          exit 1
